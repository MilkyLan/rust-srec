name: Publish CDN fallback image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdn-fallback.yml
      - scripts/cdn-fallback/**
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: cdn-fallback-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the latest stable recorder release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(gh api --paginate 'repos/hua0512/rust-srec/releases?per_page=100' --jq '
            .[] | select(.draft == false and .prerelease == false)
            | .tag_name | select(test("^rust-srec-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' | sort -V | tail -n 1)
          if [[ ! "$tag" =~ ^rust-srec-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::No stable upstream rust-srec release was found.'
            exit 1
          fi
          version=${tag#rust-srec-v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}:$version-cdn-fallback
          frontend=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:$version-cdn-fallback
          printf 'tag=%s\nversion=%s\nimage=%s\nfrontend=%s\n' "$tag" "$version" "$image" "$frontend" >> "$GITHUB_OUTPUT"
          printf 'Upstream release: %s\n\nRecorder image: %s\n\nFrontend image: %s\n' "$tag" "$image" "$frontend" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check whether this version needs publishing
        id: check
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          FRONTEND: ${{ steps.release.outputs.frontend }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] \
            && docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$FRONTEND" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            printf '\nThe scheduled check found both images already published.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out and patch the upstream release
        if: steps.check.outputs.publish == 'true'
        id: source
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/hua0512/rust-srec.git upstream
          cd upstream
          python3 - "$VERSION" <<'PY'
          import sys
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if version != sys.argv[1]:
              sys.exit(f'Cargo version {version} differs from release version {sys.argv[1]}')
          PY
          for patch in douyin.patch session-cdn-hosts.patch; do
            if ! git apply --check "../scripts/cdn-fallback/$patch"; then
              echo "::error::$patch needs review for $TAG. No image was published."
              exit 1
            fi
            git apply "../scripts/cdn-fallback/$patch"
          done
          git diff --check
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Douyin fallback and session CDN history
        if: steps.check.outputs.publish == 'true'
        working-directory: upstream
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ runner.temp }}/cdn-fallback-tests
        shell: bash
        run: |
          cargo test --locked -p rust-srec --lib --features tls-native-fallback \
            douyin_falls_back_to_blacklisted_cdn_only_when_no_admitted_alternative_exists \
            | tee "$RUNNER_TEMP/cdn-fallback-test.log"
          grep -F '1 passed; 0 failed;' "$RUNNER_TEMP/cdn-fallback-test.log"
          cargo test --locked -p rust-srec --test e2e --features tls-native-fallback \
            session_cdn_hosts_merge_all_candidates_across_reconnects \
            | tee "$RUNNER_TEMP/session-cdn-hosts-test.log"
          grep -F '1 passed; 0 failed;' "$RUNNER_TEMP/session-cdn-hosts-test.log"
          cargo test --locked -p platforms-parser --lib --features tls-native-fallback \
            records_douyin_cdn_hosts_from_all_advertised_pull_sources \
            | tee "$RUNNER_TEMP/douyin-cdn-hosts-test.log"
          grep -F '1 passed; 0 failed;' "$RUNNER_TEMP/douyin-cdn-hosts-test.log"
          cargo clean

      - name: Build and publish the recorder image
        if: steps.check.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream
          file: upstream/rust-srec/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}-cdn-fallback
            io.github.rust-srec.upstream-revision=${{ steps.source.outputs.revision }}

      - name: Build and publish the frontend image
        if: steps.check.outputs.publish == 'true'
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream/rust-srec/frontend
          file: upstream/rust-srec/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.frontend }}
          build-args: |
            VITE_UI_BUILD=${{ steps.release.outputs.version }}-cdn-fallback
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}-cdn-fallback
            io.github.rust-srec.upstream-revision=${{ steps.source.outputs.revision }}

      - name: Record published digests
        if: steps.check.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          printf '\nPublished recorder digest: %s\n\nPublished frontend digest: %s\n' "$DIGEST" "$FRONTEND_DIGEST" >> "$GITHUB_STEP_SUMMARY"
